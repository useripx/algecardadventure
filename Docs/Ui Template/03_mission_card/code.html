<style data-purpose="game-visual-fx">
    .card-text-stroke {
      -webkit-text-stroke: 4px #072a4a;
      paint-order: stroke fill;
    }
    .wood-plank-bg {
      background: linear-gradient(180deg, #ca8a04 0%, #a16207 40%, #713f12 100%);
      box-shadow: inset 0 3px 2px rgba(255, 255, 255, 0.4), inset 0 -4px 6px rgba(0, 0, 0, 0.5);
    }

    /* Floating subtle animation for mascots */
    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-bob {
      animation: gentleBob 3s ease-in-out infinite;
    }
    .animate-bob-delay {
      animation: gentleBob 3.4s ease-in-out 0.6s infinite;
    }

    /* Deck Shuffling Riffle Vibrations (at bottom draw pile) */
    @keyframes deckVibrate {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, -3px) rotate(-4deg); }
      40% { transform: translate(4px, 2px) rotate(4deg); }
      60% { transform: translate(-3px, 1px) rotate(-2deg); }
      80% { transform: translate(3px, -2px) rotate(3deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes cardRuffleLeft {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-14px, -12px) rotate(-16deg) scale(1.05); }
    }
    @keyframes cardRuffleRight {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(14px, -14px) rotate(16deg) scale(1.05); }
    }

    .shuffling-deck-active {
      animation: deckVibrate 0.18s infinite ease-in-out !important;
    }
    .shuffling-card-left {
      animation: cardRuffleLeft 0.22s infinite ease-in-out !important;
    }
    .shuffling-card-right {
      animation: cardRuffleRight 0.25s infinite ease-in-out 0.05s !important;
    }

    /* Center Cards Initial Hidden / Down in Deck State */
    .fanned-card {
      position: absolute;
      top: 50%;
      left: 50%;
      margin-left: -37px;
      margin-top: -62px;
      transform-origin: 50% 120%;
      transition: transform 0.65s cubic-bezier(0.2, 0.95, 0.2, 1.15), opacity 0.4s ease, filter 0.25s ease;
      cursor: pointer;
      will-change: transform, opacity;
      /* Default initial state: tucked down at bottom deck, hidden */
      transform: translate(0px, 240px) scale(0.4) rotate(0deg);
      opacity: 0;
      pointer-events: none;
    }

    /* Fanned Card Positions once dealt */
    .cards-dealt .fanned-card {
      opacity: 1;
      pointer-events: auto;
    }
    .cards-dealt .fanned-card.card-pos-0 { transform: translate(-124px, 14px) rotate(-14deg); z-index: 10; transition-delay: 0.05s; }
    .cards-dealt .fanned-card.card-pos-1 { transform: translate(-62px, 2px) rotate(-7deg); z-index: 11; transition-delay: 0.15s; }
    .cards-dealt .fanned-card.card-pos-2 { transform: translate(0px, -4px) rotate(0deg); z-index: 12; transition-delay: 0.25s; }
    .cards-dealt .fanned-card.card-pos-3 { transform: translate(62px, 2px) rotate(7deg); z-index: 13; transition-delay: 0.35s; }
    .cards-dealt .fanned-card.card-pos-4 { transform: translate(124px, 14px) rotate(14deg); z-index: 14; transition-delay: 0.45s; }

    /* Interactive Hover / Active Lift after dealt */
    .cards-dealt .fanned-card:hover {
      transform: translateY(-24px) scale(1.1) !important;
      z-index: 30 !important;
      filter: drop-shadow(0 14px 18px rgba(0,0,0,0.55)) brightness(1.08);
    }
    .cards-dealt .fanned-card:active {
      transform: translateY(-16px) scale(1.05) !important;
    }

    /* Button Pulse Animation when Idle */
    @keyframes deckGlowPulse {
      0%, 100% { filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.45)); }
      50% { filter: drop-shadow(0 6px 14px rgba(251, 191, 36, 0.85)); }
    }
    .deck-glow-pulse {
      animation: deckGlowPulse 2.4s ease-in-out infinite;
    }

    /* Sparkles / Magic Effect during Shuffling */
    @keyframes sparkleFade {
      0% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(45deg); }
      100% { opacity: 0; transform: scale(0.6) rotate(90deg); }
    }
    .shuffle-sparkle {
      animation: sparkleFade 0.6s ease-out infinite;
    }
  </style>

<!-- BEGIN: Interactive Logic Scripts -->
<script data-purpose="mission-interactions">
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.mission-card-item');
    const handContainer = document.getElementById('cards-hand-container');
    const modal = document.getElementById('mission-modal');
    const modalContent = document.getElementById('modal-content');
    const btnClose = document.getElementById('btn-close-modal');
    const btnContinue = document.getElementById('btn-continue');
    const btnDeckShuffle = document.getElementById('btn-deck-shuffle');
    const bottomDeckGraphic = document.getElementById('bottom-deck-graphic');
    const deckLayer1 = document.getElementById('deck-layer-1');
    const deckLayer2 = document.getElementById('deck-layer-2');
    const shuffleBtnText = document.getElementById('shuffle-btn-text');
    const shuffleIconBottom = document.getElementById('shuffle-icon-bottom');
    const shuffleStatus = document.getElementById('shuffle-status-pill');
    const shuffleStatusText = document.getElementById('shuffle-status-text');
    const shuffleStatusEmoji = document.getElementById('shuffle-status-emoji');
    const shuffleSparkles = document.getElementById('shuffle-sparkles');
    const modalBadge = document.getElementById('modal-mission-badge');
    const modalEquation = document.getElementById('modal-equation-display');
    const dialogueMain = document.getElementById('dialogue-main-text');

    // Preset equations matching mission curriculum
    const sampleEquations = [
      '3x + 5x - 2',
      '4a + 2b - a + 3b',
      '7y - (2y + 4)',
      '2(x + 3) + 4x',
      '5n + 12 - 3n + 1'
    ];

    let state = 'initial'; // 'initial' | 'shuffling' | 'dealt' | 'revealed'

    // Trigger exact 3-second shuffle sequence then deal
    function triggerCardShuffle() {
      if (state === 'shuffling') return;
      state = 'shuffling';

      // If cards were already dealt previously, retract them down first
      handContainer.classList.remove('cards-dealt');

      // Update button & badge UI for active shuffling
      btnDeckShuffle.disabled = true;
      btnDeckShuffle.classList.remove('deck-glow-pulse');
      shuffleBtnText.textContent = 'SHUFFLING...';
      shuffleIconBottom.classList.add('animate-spin');
      shuffleSparkles.classList.remove('opacity-0');
      shuffleSparkles.classList.add('opacity-100');

      // Start stationary deck riffle / vibrating animation
      bottomDeckGraphic.classList.add('shuffling-deck-active');
      deckLayer1.classList.add('shuffling-card-left');
      deckLayer2.classList.add('shuffling-card-right');

      // Display Status countdown pill
      shuffleStatusEmoji.textContent = '🔀';
      shuffleStatusText.textContent = 'Shuffling deck (3s)...';
      shuffleStatus.classList.remove('opacity-0', '-translate-y-1');
      shuffleStatus.classList.add('opacity-100', 'translate-y-0');

      // 1s countdown tick
      setTimeout(() => {
        if (state === 'shuffling') {
          shuffleStatusText.textContent = 'Shuffling deck (2s)...';
        }
      }, 1000);

      // 2s countdown tick
      setTimeout(() => {
        if (state === 'shuffling') {
          shuffleStatusText.textContent = 'Shuffling deck (1s)...';
        }
      }, 2000);

      // Exactly at 3.0 Seconds: Stop shuffle and deal cards up!
      setTimeout(() => {
        // Stop bottom deck riffle
        bottomDeckGraphic.classList.remove('shuffling-deck-active');
        deckLayer1.classList.remove('shuffling-card-left');
        deckLayer2.classList.remove('shuffling-card-right');
        shuffleSparkles.classList.remove('opacity-100');
        shuffleSparkles.classList.add('opacity-0');
        shuffleIconBottom.classList.remove('animate-spin');

        // Status update to Dealing
        shuffleStatusEmoji.textContent = '✨';
        shuffleStatusText.textContent = 'Dealing 5 mission cards!';

        // Deal cards upwards into center fan
        handContainer.classList.add('cards-dealt');

        // Update Instruction banner
        dialogueMain.innerHTML = 'Select one of the mission cards.<br><span class="text-[10px] font-fredoka font-medium text-amber-800">The question cards are determined randomly.</span>';

        // Ready button state for SHUFFLE AGAIN
        setTimeout(() => {
          shuffleBtnText.textContent = 'SHUFFLE AGAIN';
          btnDeckShuffle.disabled = false;
          btnDeckShuffle.classList.add('deck-glow-pulse');

          shuffleStatus.classList.remove('opacity-100', 'translate-y-0');
          shuffleStatus.classList.add('opacity-0', '-translate-y-1');
          state = 'dealt';
        }, 800);
      }, 3000);
    }

    function openMission(cardIndex) {
      if (state === 'shuffling') return;
      state = 'revealed';
      const index = Math.max(1, Math.min(cardIndex || 1, 5));
      modalBadge.textContent = `Mission ${index}`;
      modalEquation.textContent = sampleEquations[index - 1] || '3x + 5x - 2';

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100', 'pointer-events-auto');
      modalContent.classList.remove('scale-90');
      modalContent.classList.add('scale-100');
    }

    function closeMission() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100', 'pointer-events-auto');
      modalContent.classList.add('scale-90');
      modalContent.classList.remove('scale-100');
      state = 'dealt';
    }

    // Attach click listeners to all 5 cards
    cards.forEach((card) => {
      card.addEventListener('click', () => {
        const cardIdx = card.getAttribute('data-card-index');
        openMission(cardIdx);
      });
    });

    // Tap on bottom deck or SHUFFLE HERE button to trigger sequence
    btnDeckShuffle.addEventListener('click', triggerCardShuffle);

    // Modal dismiss actions
    btnClose.addEventListener('click', closeMission);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeMission();
      }
    });

    // Continue action button
    btnContinue.addEventListener('click', () => {
      alert('Starting math adventure with equation: ' + modalEquation.textContent.trim() + '!');
      closeMission();
    });
  });
</script>
<!-- END: Interactive Logic Scripts -->
