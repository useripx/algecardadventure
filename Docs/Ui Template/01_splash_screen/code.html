<!DOCTYPE html><html lang="en"><head>

<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['"Fredoka"', 'sans-serif'],
            baloo: ['"Baloo 2"', 'cursive', 'sans-serif'],
          },
          colors: {
            game: {
              gold: '#F5B014',
              goldLight: '#FFE259',
              goldDark: '#B87B00',
              woodBorder: '#5C381E',
              woodBg: '#8A5326',
              woodLight: '#AA6E3B',
              leafGreen: '#48C73C',
              magicBlue: '#38BDF8',
            }
          },
          boxShadow: {
            'game-btn': '0 6px 0 #5C381E, 0 10px 18px rgba(0, 0, 0, 0.4)',
            'game-btn-active': '0 2px 0 #5C381E, 0 4px 8px rgba(0, 0, 0, 0.35)',
            'glow-gold': '0 0 25px rgba(250, 204, 21, 0.75), 0 0 50px rgba(250, 204, 21, 0.4)',

<!-- Google Fonts for Playful Adventure Gaming Feel -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<!-- Core Layout and Display Styles -->
<style data-purpose="custom-layout">
    body {
      background-color: #0b1524;
      font-family: 'Baloo 2', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    /* iOS safe areas simulation and lock screen ratio */
    .app-viewport {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 932px;
      position: relative;
      overflow: hidden;
    }
  </style>
<!-- Interactive Animations & Visual Effects Styles -->
<style data-purpose="game-animations">
    @keyframes subtle-bounce {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-8px) scale(1.02);
      }
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
        box-shadow: 0 0 30px rgba(255, 226, 89, 0.9), 0 0 55px rgba(245, 176, 20, 0.6);
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }

    @keyframes ripple-effect {
      0% {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.8);
        opacity: 0;
      }
    }

    @keyframes sparkle-float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.4;
      }
      50% {
        transform: translateY(-12px) rotate(15deg);
        opacity: 0.95;
      }
    }

    .animate-prompt {
      animation: subtle-bounce 2.2s ease-in-out infinite, pulse-ring 2.2s ease-in-out infinite;
    }

    .tap-ripple {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 226, 89, 0.65) 45%, rgba(56, 189, 248, 0) 75%);
      animation: ripple-effect 0.65s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      z-index: 50;
    }

    .floating-sparkle {
      animation: sparkle-float 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

<!-- Main smartphone frame wrapper -->

<!-- BEGIN: BackgroundLayer -->
<!-- Screen 01 Visual Artwork: lush math adventure landscape with cricket mascots & title -->
<div class="absolute inset-0 z-0 overflow-hidden" data-purpose="background-artwork-wrapper">
<img alt="AlgeCard Adventure background with lush hills, castle, cricket mascots and equation book" class="w-full h-full object-cover object-center select-none pointer-events-none transform scale-[1.01]" id="splash-bg-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-7hlB93b4TGhk9_hq7sAMbve1CkBbyX4jB1DBdG5vJ6dwx9q1FBFlf-gaIPO4iqOsLcZtuO-oAtO3W8aT8Awg9oUhZZIPYhnqegGg5dFm68FC34EnBiUs89h2l9cZTnf5shvd_TSbzuALsX18pzfplOFWhYcbWnirkjKuHq83D1JHC4UmmdBhtF7X13CFt0IQwO79kFDqQEww5LMl85YYretxIBhHMAZb1P0Xehey54iPmyPgtFMJVLLxc17Yg94ihg">
<!-- Subtle top and bottom vignettes to ensure UI clarity -->
<div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-black/50 via-black/20 to-transparent pointer-events-none"></div>
<div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-black/75 via-black/35 to-transparent pointer-events-none"></div>
</div>
<!-- END: BackgroundLayer -->
<!-- BEGIN: TopBar -->
<!-- Safe Area / Mobile iOS Status Bar & Quick Game Audio Controls -->
<header class="relative z-20 pt-3 px-6 flex items-center justify-between text-white" data-purpose="top-navigation-bar">
<!-- iOS style clock indicator for app realism -->
<div class="flex items-center gap-1.5 text-xs font-semibold tracking-wider text-white/90 drop-shadow-[0_1px_3px_rgba(0,0,0,0.8)]" data-purpose="mobile-status-time">
<span>9:41</span>
</div>
<!-- Quick setting icon (Audio/Sound toggle) with click event isolation -->
<div class="flex items-center gap-2" data-purpose="top-action-buttons">
<button aria-label="Toggle sound and background music" class="w-10 h-10 rounded-full bg-black/45 backdrop-blur-md border border-white/30 flex items-center justify-center text-amber-300 shadow-lg active:scale-90 transition-transform" data-purpose="audio-toggle-button" id="audio-toggle-btn" onclick="toggleAudio(event)">
<!-- Sound on SVG icon -->
<svg class="w-5 h-5 drop-shadow" fill="currentColor" id="audio-icon-on" viewBox="0 0 24 24">

</svg>
<!-- Sound off SVG icon (hidden by default) -->
<svg class="w-5 h-5 drop-shadow hidden text-gray-300" fill="currentColor" id="audio-icon-off" viewBox="0 0 24 24">
<path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.5A2.25 2.25 0 002.25 9.75v4.5a2.25 2.25 0 002.25 2.25h1.94l4.5 4.5c.944.945 2.56.276 2.56-1.06V4.06zM17.28 9.22a.75.75 0 10-1.06 1.06L17.94 12l-1.72 1.72a.75.75 0 101.06 1.06L19 13.06l1.72 1.72a.75.75 0 101.06-1.06L20.06 12l1.72-1.72a.75.75 0 10-1.06-1.06L19 10.94l-1.72-1.72z"></path>
</svg>
</button>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: FloatingDecors -->
<!-- Magical sparkles and decorative particles overlaying the landscape -->

<!-- Upper Sparkles -->

<!-- Primary Pulsating "Tap anywhere to start" Banner -->

<!-- Shimmering overlay across the button surface -->

<div class="flex items-center justify-center gap-2.5 text-white drop-shadow-[0_2px_4px_rgba(92,56,30,0.95)]">

</svg>
<!-- Exact Required Prompt Text -->
<span class="text-xl sm:text-2xl font-extrabold tracking-wide uppercase text-white font-baloo">
            Tap anywhere to start

<svg class="w-6 h-6 text-yellow-100 fill-current drop-shadow animate-pulse" viewBox="0 0 24 24">
<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
</svg>
</div>
</div>
<!-- Secondary Subtext for Grade / Adventure Guidance -->
<div class="flex items-center justify-center gap-2 text-white/90 font-medium text-xs sm:text-sm tracking-wider drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]" data-purpose="sub-prompt-label">
<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>

<!-- Simulated Home Indicator Bar for iOS -->

</footer>
<!-- END: BottomInteractiveArea -->
<!-- BEGIN: TransitionFlashOverlay -->
<!-- Screen transition feedback when player taps to enter Screen 02 -->
<div class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center justify-center flex-col gap-3" data-purpose="level-transition-overlay" id="transition-overlay">
<div class="text-[#5C381E] text-2xl font-extrabold tracking-wider animate-bounce font-baloo">
        Entering Map...
      </div>
<!-- Progress dots -->
<div class="flex gap-2">
<span class="w-3 h-3 rounded-full bg-amber-500 animate-ping"></span>
<span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping" style="animation-delay: 0.15s"></span>
<span class="w-3 h-3 rounded-full bg-sky-500 animate-ping" style="animation-delay: 0.3s"></span>
</div>
</div>
<!-- END: TransitionFlashOverlay -->
</main>
<!-- END: MobileContainer -->
<!-- BEGIN: InteractiveScripts -->
<!-- Interactive touch wave ripple & transition logic -->
<script data-purpose="tap-ripple-and-transition">
    let isTransitioning = false;

    /**
     * Handles tap/click anywhere on the screen:
     * 1. Creates dynamic ripple wave at coordinates
     * 2. Shows feedback button press
     * 3. Triggers simulated advance to Screen 02 (Level Selection)
     */
    function handleScreenTap(event) {
      if (isTransitioning) return;

      const screenContainer = document.getElementById('game-screen');
      const rect = screenContainer.getBoundingClientRect();
      
      // Calculate coordinates relative to container
      const clickX = (event.clientX || (event.touches && event.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
      const clickY = (event.clientY || (event.touches && event.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

      // Create glowing ripple element
      const ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      const size = Math.max(rect.width, rect.height) * 0.75;
      ripple.style.width = `${size}px`;
      ripple.style.height = `${size}px`;
      ripple.style.left = `${clickX}px`;
      ripple.style.top = `${clickY}px`;
      screenContainer.appendChild(ripple);

      // Clean up ripple element after animation
      setTimeout(() => {
        if (ripple.parentNode) {
          ripple.parentNode.removeChild(ripple);
        }
      }, 700);

      // Button active tactile feedback
      const ctaBadge = document.getElementById('cta-badge');
      if (ctaBadge) {
        ctaBadge.classList.add('scale-95', 'shadow-game-btn-active');
        setTimeout(() => {
          ctaBadge.classList.remove('scale-95', 'shadow-game-btn-active');
        }, 150);
      }

      // Transition to Screen 02 (Level Selection) simulation
      isTransitioning = true;
      const overlay = document.getElementById('transition-overlay');
      
      setTimeout(() => {
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-95');
      }, 200);

      // Reset transition state after 1.8 seconds for smooth interactive replay in prototype
      setTimeout(() => {
        overlay.classList.remove('opacity-95');
        overlay.classList.add('opacity-0', 'pointer-events-none');
        isTransitioning = false;
      }, 1900);
    }

    /**
     * Toggles sound icon and handles sound button click
     */
    function toggleAudio(event) {
      // Prevent screen tap transition from firing
      event.stopPropagation();
      
      const onIcon = document.getElementById('audio-icon-on');
      const offIcon = document.getElementById('audio-icon-off');
      const isMuted = onIcon.classList.contains('hidden');

      if (isMuted) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    // Keyboard support for accessibility (Space or Enter to start)
    document.addEventListener('keydown', function(e) {
      if ((e.code === 'Space' || e.code === 'Enter') && !isTransitioning) {
        const screenContainer = document.getElementById('game-screen');
        handleScreenTap({
          clientX: screenContainer.getBoundingClientRect().left + screenContainer.offsetWidth / 2,
          clientY: screenContainer.getBoundingClientRect().top + screenContainer.offsetHeight * 0.85
        });
      }
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>
