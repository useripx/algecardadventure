      user-select: none;
      margin: 0;
      padding: 0;
      background-color: #0c1a0e;

    /* Chunky game strokes & shadows */
    .stroke-white-thick {
      -webkit-text-stroke: 4px #ffffff;
      paint-order: stroke fill;
    }
    .stroke-blue-dark {
      -webkit-text-stroke: 4px #0b4f8a;
      paint-order: stroke fill;
    }
    .stroke-brown-dark {
      -webkit-text-stroke: 4px #4a2406;
      paint-order: stroke fill;
    }
    .stroke-wood {
      -webkit-text-stroke: 2.5px #3a1a05;
      paint-order: stroke fill;
    }
    .game-shadow {
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }
    .wood-board {
      background: linear-gradient(180deg, #be7e42 0%, #8e4c19 100%);
      box-shadow: inset 0 3px 0 #ebb171, inset 0 -4px 0 #54270a, 0 10px 25px rgba(0, 0, 0, 0.4);

    .wood-banner {

      box-shadow: inset 0 2px 0 #ffffff, inset 0 -3px 0 #8c5717, 0 5px 12px rgba(0, 0, 0, 0.25);
      border: 3px solid #572d0c;
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
      50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); }
    }
    .floating-card {
      animation: floatCard 3.5s ease-in-out infinite;

    .floating-card-delayed {

<script>
    function launchLevel(levelName) {
      const toast = document.getElementById('quest-toast');
      const title = document.getElementById('toast-title');
      const desc = document.getElementById('toast-desc');

      title.textContent = `${levelName} Level Selected!`;
      desc.textContent = `Preparing adventure cards...`;
      
      toast.classList.remove('hidden');
      toast.classList.add('flex');

      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 1500);
    }
  </script>
